<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #0b0f19;
            flex-shrink: 0;
        }
        .menu-btn, .top-icon-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
        .header-title {
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
        }
        .gemini-sparkle {
            font-size: 40px;
            margin-bottom: 12px;
            background: linear-gradient(42deg, #4285F4, #9B72CB, #EA4335);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .center-title {
            font-size: 28px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 20px;
        }
        /* Chat History Area */
        .chat-history {
            display: none;
            width: 100%;
            max-width: 650px;
            flex: 1;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            box-sizing: border-box;
            gap: 20px;
            flex-direction: column;
            margin-bottom: 10px;
        }
        .chat-message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }
        .user-wrapper {
            align-self: flex-end;
        }
        .ai-wrapper {
            align-self: flex-start;
            width: 100%;
            max-width: 100%;
        }
        .chat-message {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #2b3b5e;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            background-color: #161c2c;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid #2d3748;
        }
        /* Gemini style action buttons below AI response */
        .ai-actions-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
            padding-left: 4px;
        }
        .ai-action-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .ai-action-btn:hover {
            color: #ffffff;
        }
        .ai-actions-bar .audio-btn {
            margin-left: auto;
        }

        /* Bottom Input Box Container */
        .input-box-wrapper {
            position: relative;
            width: 92%;
            max-width: 650px;
            margin-bottom: 25px;
            flex-shrink: 0;
        }
        .input-box {
            display: flex;
            align-items: center;
            background-color: #171c28;
            border: 1px solid #2d3748;
            padding: 10px 18px;
            border-radius: 35px;
            width: 100%;
            box-sizing: border-box;
        }
        .plus-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            margin-right: 12px;
            display: flex;
            align-items: center;
        }
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .input-box input::placeholder {
            color: #94a3b8;
        }
        .action-btns {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mic-btn, .send-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            display: flex;
            align-items: center;
        }
        /* Popup Menu */
        .plus-popup {
            display: none;
            position: absolute;
            bottom: 75px;
            left: 0;
            right: 0;
            margin: 0 auto;
            background-color: #161c2c;
            border: 1px solid #2d3748;
            border-radius: 24px;
            width: 92%;
            max-width: 420px;
            max-height: 75vh;
            overflow-y: auto;
            box-shadow: 0px 15px 40px rgba(0,0,0,0.85);
            z-index: 1000;
            text-align: left;
            padding: 12px;
            box-sizing: border-box;
        }
        .plus-popup.active {
            display: block;
        }
        .popup-top-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            justify-content: space-between;
        }
        .popup-card-btn {
            flex: 1;
            background-color: #212c42;
            border: none;
            border-radius: 18px;
            padding: 16px 10px;
            color: white;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

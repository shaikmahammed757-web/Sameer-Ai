<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #121826;
            border-bottom: 1px solid #1f293d;
        }
        .menu-btn, .new-chat-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
        }
        h2 {
            margin-bottom: 20px;
            font-weight: 400;
        }
        .features-grid {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .feature-btn {
            background-color: #1e293b;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
        }
        .feature-list {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .list-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 12px 18px;
            border-radius: 14px;
            text-align: left;
            cursor: pointer;
        }
        .list-item strong {
            display: block;
            font-size: 15px;
        }
        .list-item small {
            color: #8b949e;
            font-size: 13px;
        }
        .input-box {
            display: flex;
            align-items: center;
            background-color: #1e293b;
            padding: 10px 15px;
            border-radius: 30px;
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .input-box button {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            margin-left: 10px;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #121826;
            transition: 0.3s;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #1f293d;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-menu li {
            padding: 12px 0;
            border-bottom: 1px solid #1f293d;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <span style="font-size: 18px; font-weight: bold;">Ai Sameer Pro</span>
        <button class="new-chat-btn" onclick="location.reload()">✏️</button>
    </header>

    <!-- Sidebar Menu -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Ai Sameer</h3>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li onclick="alert('New chat started')">➕ New chat</li>
            <li onclick="alert('Opening Images')">🖼️ Images</li>
            <li onclick="alert('Opening Library')">📁 Library</li>
            <li onclick="alert('Opening Notebooks')">📓 New notebook</li>
        </ul>
    </div>

    <div class="main-container">
        <h2>Where should we start?</h2>
        
        <div class="features-grid">
            <button class="feature-btn">Photos</button>
            <button class="feature-btn">Camera</button>
            <button class="feature-btn">Avatar</button>
        </div>

        <div class="feature-list">
            <div class="list-item">
                <strong>Images</strong>
                <small>Create and edit images</small>
            </div>
            <div class="list-item">
                <strong>Music</strong>
                <small>Make audio tracks</small>
            </div>
            <div class="list-item">
                <strong>Canvas</strong>
                <small>Code, write or make slides</small>
            </div>
        </div>

        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask Ai Sameer...">
            <button onclick="startVoiceRecognition()" title="Voice Input">🎤</button>
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("మీ బ్రౌజర్ వాయిస్ రికగ్నిషన్‌ని సపోర్ట్ చేయదు.");
                return;
            }
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'te-IN';
            recognition.start();

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechToText;
            };

            recognition.onerror = function(event) {
                alert("మైక్ రికగ్నిషన్‌లో లోపం ఏర్పడింది. దయచేసి మళ్లీ ప్రయత్నించండి.");
            };
        }

        function sendMessage() {
            const text = document.getElementById('userInput').value;
            if (text.trim() !== "") {
                alert("సందేశం పంపబడింది: " + text);
                document.getElementById('userInput').value = "";
            }
        }
    </script>

</body>
</html>

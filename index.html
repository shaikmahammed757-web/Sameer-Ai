<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #0b0f19;
        }
        .menu-btn, .top-icon-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .header-title {
            font-size: 18px;
            font-weight: 500;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }
        .logo-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 400;
            font-size: 26px;
        }
        .features-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .feature-btn {
            background-color: #1e293b;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .feature-list {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .list-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 10px 15px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
        }
        .list-item strong {
            display: block;
            font-size: 14px;
        }
        .list-item small {
            color: #8b949e;
            font-size: 12px;
        }
        .input-box-wrapper {
            position: relative;
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .input-box {
            display: flex;
            align-items: center;
            background-color: #171c28;
            border: 1px solid #2d3748;
            padding: 8px 15px;
            border-radius: 35px;
            width: 100%;
            box-sizing: border-box;
        }
        .plus-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            margin-right: 12px;
        }
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .action-btns {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mic-btn, .send-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }
        .plus-popup {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 0;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            width: 230px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.6);
            z-index: 1000;
            text-align: left;
        }
        .plus-popup.active {
            display: block;
        }
        .popup-item {
            padding: 12px 15px;
            font-size: 14px;
            color: #ffffff;
            cursor: pointer;
            border-bottom: 1px solid #21262d;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #121826;
            transition: 0.3s;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #1f293d;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-menu li {
            padding: 12px 0;
            border-bottom: 1px solid #1f293d;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="header-title">Ai Sameer Pro</div>
        <button class="top-icon-btn" onclick="location.reload()">✏️</button>
    </header>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Ai Sameer</h3>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li onclick="alert('New chat started')">➕ New chat</li>
            <li onclick="alert('Opening Images')">🖼️ Images</li>
            <li onclick="alert('Library opened')">📁 Library</li>
            <li onclick="alert('New notebook opened')">📓 New notebook</li>
        </ul>
    </div>

    <div class="main-container">
        <div class="logo-icon">✨</div>
        <h2>Your move, Shaik!</h2>
        
        <div class="features-grid">
            <button class="feature-btn" onclick="alert('Photos clicked')">Photos</button>
            <button class="feature-btn" onclick="alert('Camera clicked')">Camera</button>
            <button class="feature-btn" onclick="alert('Avatar clicked')">Avatar</button>
        </div>

        <div class="feature-list">
            <div class="list-item" onclick="alert('Images feature')">
                <strong>Images</strong>
                <small>Create and edit images</small>
            </div>
            <div class="list-item" onclick="alert('Music feature')">
                <strong>Music</strong>
                <small>Make audio tracks</small>
            </div>
            <div class="list-item" onclick="alert('Canvas feature')">
                <strong>Canvas</strong>
                <small>Code, write or make slides</small>
            </div>
        </div>

        <div class="input-box-wrapper">
            <div id="plusPopup" class="plus-popup">
                <div class="popup-item" onclick="selectOption('Upload Photo')">📷 Upload Photo</div>
                <div class="popup-item" onclick="selectOption('Upload Video')">🎥 Upload Video</div>
                <div class="popup-item" onclick="selectOption('Text to Image')">🖼️ Text to Image</div>
                <div class="popup-item" onclick="selectOption('Text to Video')">🎬 Text to Video</div>
            </div>

            <div class="input-box">
                <button class="plus-btn" onclick="togglePlusMenu(event)">+</button>
                <input type="text" id="userInput" placeholder="Ask Ai Sameer...">
                <div class="action-btns">
                    <button class="mic-btn" onclick="startVoiceRecognition()" title="Voice Input">🎤</button>
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function togglePlusMenu(event) {
            event.stopPropagation();
            const popup = document.getElementById('plusPopup');
            popup.classList.toggle('active');
        }

        function selectOption(optionName) {
            document.getElementById('userInput').value = optionName + ": ";
            document.getElementById('plusPopup').classList.remove('active');
        }

        window.addEventListener('click', function(event) {
            const popup = document.getElementById('plusPopup');
            if (popup && !event.target.closest('.input-box-wrapper')) {
                popup.classList.remove('active');
            }
        });

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("ఈ బ్రౌజర్ వాయిస్ రికగ్నిషన్‌ని సపోర్ట్ చేయదు.");
                return;
            }
            
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'te-IN';
                recognition.onresult = function(event) {
                    document.getElementById('userInput').value = event.results[0][0].transcript;
                };
                recognition.onerror = function() {
                    alert("మైక్ పర్మిషన్ లేదా నెట్‌వర్క్ సమస్య ఉంది.");
                };
                recognition.start();
            } catch (e) {
                alert("మైక్ రన్ చేయడం కుదరలేదు.");
            }
        }

        function sendMessage() {
            const text = document.getElementById('userInput').value;
            if (text.trim() !== "") {
                alert("సందేశం పంపబడింది: " + text);
                document.getElementById('userInput').value = "";
            }
        }
    </script>

</body>
</html>

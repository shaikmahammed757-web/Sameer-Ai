<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #0b0f19;
            flex-shrink: 0;
        }
        .menu-btn, .top-icon-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
        .header-title {
            font-size: 18px;
            font-weight: 500;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
        }
        .gemini-sparkle {
            font-size: 40px;
            margin-bottom: 12px;
            background: linear-gradient(42deg, #4285F4, #9B72CB, #EA4335);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .center-title {
            font-size: 28px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 20px;
        }
        .chat-history {
            display: none;
            width: 100%;
            max-width: 650px;
            flex: 1;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            box-sizing: border-box;
            gap: 20px;
            flex-direction: column;
            margin-bottom: 10px;
        }
        .chat-message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }
        .user-wrapper {
            align-self: flex-end;
        }
        .ai-wrapper {
            align-self: flex-start;
            width: 100%;
            max-width: 100%;
        }
        .chat-message {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-msg {
            background-color: #2b3b5e;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            background-color: #161c2c;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid #2d3748;
        }
        .ai-actions-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            padding-left: 4px;
        }
        .ai-action-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .ai-action-btn:hover {
            color: #ffffff;
        }
        .input-box-wrapper {
            position: relative;
            width: 92%;
            max-width: 650px;
            margin-bottom: 25px;
            flex-shrink: 0;
        }
        .input-box {
            display: flex;
            align-items: center;
            background-color: #171c28;
            border: 1px solid #2d3748;
            padding: 10px 18px;
            border-radius: 35px;
            width: 100%;
            box-sizing: border-box;
            gap: 10px;
        }
        .plus-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
            min-width: 0;
        }
        .input-box input::placeholder {
            color: #94a3b8;
        }
        .action-btns {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .mic-btn, .send-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            display: flex;
            align-items: center;
        }
        .mic-btn.listening {
            color: #4285F4;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .plus-popup {
            display: none;
            position: absolute;
            bottom: 75px;
            left: 0;
            right: 0;
            margin: 0 auto;
            background-color: #161c2c;
            border: 1px solid #2d3748;
            border-radius: 24px;
            width: 92%;
            max-width: 420px;
            max-height: 75vh;
            overflow-y: auto;
            box-shadow: 0px 15px 40px rgba(0,0,0,0.85);
            z-index: 1000;
            text-align: left;
            padding: 12px;
            box-sizing: border-box;
        }
        .plus-popup.active {
            display: block;
        }
        .popup-top-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            justify-content: space-between;
        }
        .popup-card-btn {
            flex: 1;
            background-color: #212c42;
            border: none;
            border-radius: 18px;
            padding: 16px 10px;
            color: white;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .popup-card-btn:hover {
            background-color: #2c3a56;
        }
        .popup-card-btn span.icon {
            font-size: 22px;
        }
        .popup-list-item {
            padding: 12px 14px;
            font-size: 14px;
            color: #ffffff;
            cursor: pointer;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }
        .popup-list-item:hover {
            background-color: #222d44;
        }
        .popup-list-item .item-icon {
            font-size: 20px;
        }
        .popup-list-item .item-desc {
            font-size: 12px;
            color: #94a3b8;
            display: block;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #121826;
            transition: 0.3s;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #1f293d;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-menu li {
            padding: 12px 0;
            border-bottom: 1px solid #1f293d;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="header-title">Ai Sameer</div>
        <button class="top-icon-btn" onclick="location.reload()">✏️</button>
    </header>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Ai Sameer</h3>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li onclick="alert('New chat started')">➕ New chat</li>
            <li onclick="alert('Opening Images')">🖼️ Images</li>
            <li onclick="alert('Library opened')">📁 Library</li>
            <li onclick="alert('New notebook opened')">📓 New notebook</li>
        </ul>
    </div>

    <div class="main-container" id="mainContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="gemini-sparkle">✦</div>
            <div class="center-title">Ai Sameer</div>
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <div class="input-box-wrapper">
            <div id="plusPopup" class="plus-popup">
                <div class="popup-top-grid">
                    <button class="popup-card-btn" onclick="selectOption('Photos')">
                        <span class="icon">🖼️</span>
                        <span>Photos</span>
                    </button>
                    <button class="popup-card-btn" onclick="selectOption('Camera')">
                        <span class="icon">📷</span>
                        <span>Camera</span>
                    </button>
                    <button class="popup-card-btn" onclick="selectOption('Avatar')">
                        <span class="icon">😊</span>
                        <span>Avatar</span>
                    </button>
                </div>

                <div class="popup-list-item" onclick="selectOption('Images')">
                    <span class="item-icon">🎨</span>
                    <div>
                        <strong>Images</strong>
                        <span class="item-desc">Create and edit images</span>
                    </div>
                </div>
                <div class="popup-list-item" onclick="selectOption('Music')">
                    <span class="item-icon">🎵</span>
                    <div>
                        <strong>Music</strong>
                        <span class="item-desc">Make audio tracks</span>
                    </div>
                </div>
                <div class="popup-list-item" onclick="selectOption('Canvas')">
                    <span class="item-icon">📄</span>
                    <div>
                        <strong>Canvas</strong>
                        <span class="item-desc">Code, write or make slides</span>
                    </div>
                </div>
                <div class="popup-list-item" onclick="selectOption('Deep Research')">
                    <span class="item-icon">🌐</span>
                    <div>
                        <strong>Deep Research</strong>
                        <span class="item-desc">Get detailed reports</span>
                    </div>
                </div>
                <div class="popup-list-item" onclick="selectOption('Guided Learning')">
                    <span class="item-icon">📖</span>
                    <div>
                        <strong>Guided Learning</strong>
                        <span class="item-desc">Get step-by-step help</span>
                    </div>
                </div>
            </div>

            <div class="input-box">
                <button class="plus-btn" onclick="togglePlusMenu(event)">＋</button>
                <input type="text" id="userInput" placeholder="Ask Ai Sameer" onkeypress="handleKeyPress(event)">
                <div class="action-btns">
                    <button class="mic-btn" id="micBtn" onclick="startVoiceRecognition()" title="Voice Input">🎤</button>
                    <button class="send-btn" onclick="sendMessage()" title="Send">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function togglePlusMenu(event) {
            event.stopPropagation();
            const popup = document.getElementById('plusPopup');
            popup.classList.toggle('active');
        }

        function selectOption(optionName) {
            document.getElementById('userInput').value = optionName + ": ";
            document.getElementById('plusPopup').classList.remove('active');
        }

        window.addEventListener('click', function(event) {
            const popup = document.getElementById('plusPopup');
            if (popup && !event.target.closest('.input-box-wrapper')) {
                popup.classList.remove('active');
            }
        });

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (text === "") return;

            document.getElementById('welcomeScreen').style.display = 'none';
            const history = document.getElementById('chatHistory');
            history.style.display = 'flex';

            const userWrapper = document.createElement('div');
            userWrapper.className = 'chat-message-wrapper user-wrapper';
            const userMsg = document.createElement('div');
            userMsg.className = 'chat-message user-msg';
            userMsg.innerText = text;
            userWrapper.appendChild(userMsg);
            history.appendChild(userWrapper);

            input.value = "";
            history.scrollTop = history.scrollHeight;

            setTimeout(() => {
                const aiWrapper = document.createElement('div');
                aiWrapper.className = 'chat-message-wrapper ai-wrapper';

                const aiMsg = document.createElement('div');
                aiMsg.className = 'chat-message ai-msg';
                
                let lowerText = text.toLowerCase();
                let responseText = "";
                let langCode = 'te-IN';

                if (lowerText.includes('sk md') || lowerText.includes('riding') || lowerText.includes('యూట్యూబ్') || lowerText.includes('డిలీట్')) {
                    if (lowerText.includes('riding')) {
                        responseText = "ఎస్.కె. ఎండి రైడింగ్ టీవీ (SK MD RIDING TV) యూట్యూబ్ ఛానెల్‌కి స్వాగతం! ఇక్కడ అద్భుతమైన రైడింగ్ కంటెంట్ అందుబాటులో ఉంది.";
                    } else if (lowerText.includes('డిలీట్')) {
                        responseText = "యూట్యూబ్ ఛానెల్‌ని డిలీట్ చేయడానికి: YouTube Studio -> Settings -> Channel -> Advanced settings -> Remove YouTube content.";
                    } else {
                        responseText = "ఎస్.కె. ఎండి రైడింగ్ టీవీ (SK MD RIDING TV) ఛానెల్ మరియు అప్‌డేట్స్ గురించి మీకు పూర్తి వివరాలు అందిస్తున్నాను!";
                    }
                } else if (/[\u0c00-\u0c7f]/.test(text)) {
                    langCode = 'te-IN';
                    responseText = "నమస్తే షైక్! నేను Ai Sameer ని. మీరు అడిగిన \"" + text + "\" అంశంపై పూర్తి వివరాలను అందిస్తున్నాను.";
                } else if (/[\u0900-\u097f]/.test(text)) {
                    langCode = 'hi-IN';
                    responseText = "नमस्ते शेख! मैं Ai Sameer हूँ। आपके द्वारा पूछे गए प्रश्न \"" + text + "\" का उत्तर यह है।";
                } else {
                    langCode = 'en-US';
                    responseText = "Hello Shaik! I am Ai Sameer. Here is the detailed information regarding \"" + text + "\".";
                }

                aiMsg.innerText = responseText;
                aiWrapper.appendChild(aiMsg);

                const actionsBar = document.createElement('div');
                actionsBar.className = 'ai-actions-bar';
                
                const thumbsUp = document.createElement('button');
                thumbsUp.className = 'ai-action-btn';
                thumbsUp.innerHTML = '👍';
                thumbsUp.onclick = () => alert('Feedback recorded: Helpful');

                const thumbsDown = document.createElement('button');
                thumbsDown.className = 'ai-action-btn';
                thumbsDown.innerHTML = '👎';
                thumbsDown.onclick = () => alert('Feedback recorded: Unhelpful');

                const refreshBtn = document.createElement('button');
                refreshBtn.className = 'ai-action-btn';
                refreshBtn.innerHTML = '🔄';
                refreshBtn.onclick = () => alert('Retrying response...');

                const copyBtn = document.createElement('button');
                copyBtn.className = 'ai-action-btn';
                copyBtn.innerHTML = '📋';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(responseText).then(() => {
                        alert('Copied to clipboard!');
                    });
                };

                const audioBtn = document.createElement('button');
                audioBtn.className = 'ai-action-btn';
                audioBtn.innerHTML = '🔊';
                audioBtn.onclick = () => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(responseText);
                        utterance.lang = langCode;
                        window.speechSynthesis.speak(utterance);
                    } else {
                        alert('Audio speech not supported.');
                    }
                };

                actionsBar.appendChild(thumbsUp);
                actionsBar.appendChild(thumbsDown);
                actionsBar.appendChild(refreshBtn);
                actionsBar.appendChild(copyBtn);
                actionsBar.appendChild(audioBtn);

                aiWrapper.appendChild(actionsBar);
                history.appendChild(aiWrapper);
                history.scrollTop = history.scrollHeight;
            }, 500);
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const micBtn = document.getElementById('micBtn');

            if (!SpeechRecognition) {
                const spokenText = prompt("దయచేసి మీ సందేశాన్ని ఇక్కడ టైప్ చేయండి:");
                if (spokenText) {
                    document.getElementById('userInput').value = spokenText;
                    sendMessage();
                }
                return;
            }
            
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'te-IN';
                recognition.interimResults = false;
                
                recognition.onstart = function() {
                    micBtn.classList.add('listening');
                };

                recognition.onresult = function(event) {
                    document.getElementById('userInput').value = event.results[0][0].transcript;
                    micBtn.classList.remove('listening');
                    sendMessage();
                };
                
                recognition.onerror = function(event) {
                    micBtn.classList.remove('listening');
                };

                recognition.onend = function() {
                    micBtn.

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: #0b0f19;
            flex-shrink: 0;
        }
        .menu-btn, .top-icon-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
        .header-title {
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 20px 16px;
            box-sizing: border-box;
            position: relative;
        }
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
        }
        .gemini-sparkle {
            font-size: 42px;
            margin-bottom: 12px;
            background: linear-gradient(42deg, #4285F4, #9B72CB, #EA4335);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .center-title {
            font-size: 30px;
            font-weight: 400;
            color: #ffffff;
            margin: 0;
        }
        /* Bottom Input Box Container */
        .input-box-wrapper {
            position: relative;
            width: 100%;
            max-width: 650px;
            flex-shrink: 0;
        }
        .input-box {
            display: flex;
            align-items: center;
            background-color: #171c28;
            border: 1px solid #2d3748;
            padding: 10px 18px;
            border-radius: 35px;
            width: 100%;
            box-sizing: border-box;
        }
        .plus-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            margin-right: 12px;
            display: flex;
            align-items: center;
        }
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .input-box input::placeholder {
            color: #94a3b8;
        }
        .action-btns {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mic-btn, .send-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 20px;
            padding: 5px;
            display: flex;
            align-items: center;
        }
        /* Full Gemini Style Popup Menu */
        .plus-popup {
            display: none;
            position: absolute;
            bottom: 75px;
            left: 0;
            right: 0;
            margin: 0 auto;
            background-color: #161c2c;
            border: 1px solid #2d3748;
            border-radius: 24px;
            width: 92%;
            max-width: 420px;
            max-height: 75vh;
            overflow-y: auto;
            box-shadow: 0px 15px 40px rgba(0,0,0,0.85);
            z-index: 1000;
            text-align: left;
            padding: 12px;
            box-sizing: border-box;
        }
        .plus-popup.active {
            display: block;
        }
        .popup-top-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            justify-content: space-between;
        }
        .popup-card-btn {
            flex: 1;
            background-color: #212c42;
            border: none;
            border-radius: 18px;
            padding: 16px 10px;
            color: white;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .popup-card-btn:hover {
            background-color: #2c3a56;
        }
        .popup-card-btn span.icon {
            font-size: 22px;
        }
        .popup-list-item {
            padding: 12px 14px;
            font-size: 14px;
            color: #ffffff;
            cursor: pointer;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }
        .popup-list-item:hover {
            background-color: #222d44;
        }
        .popup-list-item .item-icon {
            font-size: 20px;
        }
        .popup-list-item .item-desc {
            font-size: 12px;
            color: #94a3b8;
            display: block;
        }
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #121826;
            transition: 0.3s;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #1f293d;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-menu li {
            padding: 12px 0;
            border-bottom: 1px solid #1f293d;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="header-title">
            <span>Ai Sameer</span> ▾
        </div>
        <button class="top-icon-btn" onclick="location.reload()">✏️</button>
    </header>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Ai Sameer</h3>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li onclick="alert('New chat started')">➕ New chat</li>
            <li onclick="alert('Opening Images')">🖼️ Images</li>
            <li onclick="alert('Library opened')">📁 Library</li>
            <li onclick="alert('New notebook opened')">📓 New notebook</li>
        </ul>
    </div>

    <div class="main-container">
        <div class="center-content">
            <div class="gemini-sparkle">✦</div>
            <div class="center-title">Ai Sameer</div>
        </div>

        <div class="input-box-wrapper">
            <!-- Full Gemini Popup Menu -->
            <div id="plusPopup" class="plus-popup">
                <div class="popup-top-grid">
                    <button class="popup-card-btn" onclick="selectOption('Photos')">
                        <span class="icon">🖼️</span>
                        <span>Photos</span>
                    </button>
                    <button class="popup-card-btn" onclick="selectOption('Camera')">
                        <span class="icon">📷</span>
                        <span>Camera</span>
                    </button>
                    <button class="popup-card-btn" onclick="selectOption('Avatar')">
                        <span class="icon">😊</span>
                        <span>Avatar</span>
                    </button>
                </div>

                <div class="popup-list-item" onclick="selectOption('Images')">
                    <span class="item-icon">🎨</span>
                    <div>
                        <strong>Images</strong>
                        <span class="item-desc">Create and edit images</span>
                    </div>
                </div>
                <div class="popup-list-item" onclick="selectOption('Music')">
                    <span class="item-icon">🎵</span>
                    <div>
                        <strong>Music</strong>
                        <span class="item-desc">Make audio tracks</span>
                    </div>
                </div>
                <div class="popup-list-item" onclick="selectOption('Canvas')">
                    <span class="item-icon">📄</span>
                    <div>
                        <strong>Canvas</strong>
                        <span class="item-desc">Code, write or make slides</span>
                    </div>
                </div>
                <div class="popup-list-item" onclick="selectOption('Deep Research')">
                    <span class="item-icon">🌐</span>
                    <div>
                        <strong>Deep Research</strong>
                        <span class="item-desc">Get detailed reports</span>
                    </div>
                </div>
                <div class="popup-list-item" onclick="selectOption('Guided Learning')">
                    <span class="item-icon">📖</span>
                    <div>
                        <strong>Guided Learning</strong>
                        <span class="item-desc">Get step-by-step help</span>
                    </div>
                </div>
            </div>

            <div class="input-box">
                <button class="plus-btn" onclick="togglePlusMenu(event)">＋</button>
                <input type="text" id="userInput" placeholder="Ask Ai Sameer">
                <div class="action-btns">
                    <button class="mic-btn" onclick="startVoiceRecognition()" title="Voice Input">🎤</button>
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function togglePlusMenu(event) {
            event.stopPropagation();
            const popup = document.getElementById('plusPopup');
            popup.classList.toggle('active');
        }

        function selectOption(optionName) {
            document.getElementById('userInput').value = optionName + ": ";
            document.getElementById('plusPopup').classList.remove('active');
        }

        window.addEventListener('click', function(event) {
            const popup = document.getElementById('plusPopup');
            if (popup && !event.target.closest('.input-box-wrapper')) {
                popup.classList.remove('active');
            }
        });

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("ఈ బ్రౌజర్ వాయిస్ రికగ్నిషన్‌ని సపోర్ట్ చేయదు.");
                return;
            }
            
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'te-IN';
                recognition.interimResults = false;
                
                recognition.onresult = function(event) {
                    document.getElementById('userInput').value = event.results[0][0].transcript;
                };
                
                recognition.onerror = function(event) {
                    alert("మైక్ పర్మిషన్ లేదా నెట్‌వర్క్ సమస్య ఉంది.");
                };
                
                recognition.start();
            } catch (e) {
                alert("మైక్ రన్ చేయడం కుదరలేదు.");
            }
        }

        function sendMessage() {
            const text = document.getElementById('userInput').value;
            if (text.trim() !== "") {
                alert("సందేశం పంపబడింది: " + text);
                document.getElementById('userInput').value = "";
            }
        }
    </script>

</body>
</html>

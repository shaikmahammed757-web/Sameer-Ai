<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer Pro</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #121826;
            border-bottom: 1px solid #1f293d;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .features-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .feature-btn {
            background-color: #1e293b;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
        }
        .input-box {
            display: flex;
            align-items: center;
            background-color: #1e293b;
            padding: 10px 15px;
            border-radius: 30px;
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .input-box button {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <header>
        <span style="font-size: 18px; font-weight: bold;">Ai Sameer Pro</span>
    </header>

    <div class="chat-container">
        <h2>Where should we start?</h2>
        
        <div class="features-grid">
            <button class="feature-btn">Photos</button>
            <button class="feature-btn">Camera</button>
            <button class="feature-btn">Avatar</button>
        </div>

        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask Ai Sameer...">
            <button onclick="startVoiceRecognition()" title="Voice Input">🎤</button>
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // Service Worker Registration for PWA Install Prompt
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Service Worker registered', reg))
                    .catch((err) => console.log('Service Worker failed', err));
            });
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("మీ బ్రౌజర్ వాయిస్ రికగ్నిషన్‌ని సపోర్ట్ చేయదు.");
                return;
            }
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'te-IN';
            recognition.start();

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechToText;
            };

            recognition.onerror = function(event) {
                alert("మైక్ రికగ్నిషన్‌లో లోపం ఏర్పడింది. దయచేసి మళ్లీ ప్రయత్నించండి.");
            };
        }

        function sendMessage() {
            const text = document.getElementById('userInput').value;
            if (text.trim() !== "") {
                alert("సందేశం పంపబడింది: " + text);
                document.getElementById('userInput').value = "";
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #121826;
            border-bottom: 1px solid #1f293d;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
        }
        .features-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .feature-btn {
            background-color: #1e293b;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .menu-list {
            width: 100%;
            max-width: 400px;
            text-align: left;
            margin-bottom: 20px;
        }
        .menu-item {
            background-color: #121826;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            font-size: 15px;
            border: 1px solid #1f293d;
        }
        .input-box {
            display: flex;
            align-items: center;
            background-color: #1e293b;
            padding: 10px 15px;
            border-radius: 30px;
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .input-box button {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <header>
        <span style="font-size: 18px; font-weight: bold;">Ai Sameer Pro</span>
    </header>

    <div class="chat-container">
        <h2>Where should we start?</h2>
        
        <div class="features-grid">
            <button class="feature-btn">Photos</button>
            <button class="feature-btn">Camera</button>
            <button class="feature-btn">Avatar</button>
        </div>

        <div class="menu-list">
            <div class="menu-item">Images <span style="font-size: 12px; color: #94a3b8; display: block;">Create and edit</span></div>
            <div class="menu-item">Music <span style="font-size: 12px; color: #94a3b8; display: block;">Make audio tracks</span></div>
            <div class="menu-item">Canvas <span style="font-size: 12px; color: #94a3b8; display: block;">Code, write or make slides</span></div>
        </div>

        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask Ai Sameer...">
            <button onclick="startVoiceRecognition()" title="Voice Input">🎤</button>
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("ఈ బ్రౌజర్‌లో వాయిస్ రికగ్నిషన్ సపోర్ట్ చేయదు. దయచేసి టైప్ చేయండి.");
                return;
            }
            
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'te-IN';
                recognition.start();

                recognition.onresult = function(event) {
                    document.getElementById('userInput').value = event.results[0][0].transcript;
                };

                recognition.onerror = function(event) {
                    alert("మైక్ పర్మిషన్ లేదా నెట్‌వర్క్ లోపం ఉంది.");
                };
            } catch (e) {
                alert("మైక్ రన్ చేయడం కుదరలేదు.");
            }
        }

        function sendMessage() {
            const text = document.getElementById('userInput').value;
            if (text.trim() !== "") {
                alert("సందేశం పంపబడింది: " + text);
                document.getElementById('userInput').value = "";
            }
        }
    </script>

</body>
</html>

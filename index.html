    <script>
        const plusBtn = document.getElementById('plusBtn');
        const menuOverlay = document.getElementById('menuOverlay');
        const chatContainer = document.getElementById('chatContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const userInput = document.getElementById('userInput');
        const micBtn = document.getElementById('micBtn');

        plusBtn.addEventListener('click', () => {
            menuOverlay.style.display = 'flex';
        });

        menuOverlay.addEventListener('click', (e) => {
            if (e.target === menuOverlay) {
                menuOverlay.style.display = 'none';
            }
        });

        function selectTool(toolName) {
            menuOverlay.style.display = 'none';
            welcomeScreen.style.display = 'none';
            chatContainer.style.display = 'flex';
            
            appendMsg(`Selected Tool: ${toolName}`, 'user-msg');
            setTimeout(() => {
                appendMsg(`Ai Sameer: ${toolName} pipeline is active and ready! (Daily limits active)`, 'ai-msg');
            }, 500);
        }

        function selectRowTool(toolName) {
            selectTool(toolName);
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && userInput.value.trim() !== '') {
                submitMessage(userInput.value);
            }
        });

        // Speech Recognition (Mic Feature)
        micBtn.addEventListener('click', () => {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Speech recognition is not supported in this browser. Please use Chrome or Android webview.');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            // Telugu and English support
            recognition.lang = 'te-IN'; 
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micBtn.style.color = '#3b82f6'; // Highlight mic when listening
            userInput.placeholder = "వింటున్నాను మాట్లాడండి... (Listening...)";

            recognition.start();

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                userInput.value = speechText;
                micBtn.style.color = '#cbd5e1';
                userInput.placeholder = "Ask Ai Sameer...";
                if (speechText.trim() !== '') {
                    submitMessage(speechText);
                }
            };

            recognition.onerror = function(event) {
                micBtn.style.color = '#cbd5e1';
                userInput.placeholder = "Ask Ai Sameer...";
            };

            recognition.onend = function() {
                micBtn.style.color = '#cbd5e1';
                userInput.placeholder = "Ask Ai Sameer...";
            };
        });

        function submitMessage(text) {
            welcomeScreen.style.display = 'none';
            chatContainer.style.display = 'flex';
            userInput.value = '';
            appendMsg(text, 'user-msg');
            setTimeout(() => {
                appendMsg(`Ai Sameer: Processing your request for "${text}". All AI pipelines are active!`, 'ai-msg');
            }, 600);
        }

        function appendMsg(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>

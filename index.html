<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #0b0f19;
        }
        .menu-btn, .top-icon-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 500;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
        }
        .logo-icon {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #4285F4, #9B72CB, #D96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 400;
            font-size: 28px;
        }
        .features-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .feature-btn {
            background-color: #1e293b;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .feature-list {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .list-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 10px 15px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
        }
        .list-item strong {
            display: block;
            font-size: 14px;
        }
        .list-item small {
            color: #8b949e;
            font-size: 12px;
        }
        /* Input Box matching Gemini Style */
        .input-box {
            display: flex;
            align-items: center;
            background-color: #171c28;
            border: 1px solid #2d3748;
            padding: 8px 15px;
            border-radius: 35px;
            width: 90%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .plus-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            margin-right: 12px;
        }
        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .input-box input::placeholder {
            color: #8b949e;
        }
        .action-btns {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mic-btn, .send-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #121826;
            transition: 0.3s;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #1f293d;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-menu li {
            padding: 12px 0;
            border-bottom: 1px solid #1f293d;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="header-title">
            <span>Ai Sameer Auto</span>
        </div>
        <button class="top-icon-btn" onclick="location.reload()">✏️</button>
    </header>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Ai Sameer</h3>
            <button class="menu-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li onclick="alert('New chat started')">➕ New chat</li>
            <li onclick="alert('Opening Images')">🖼️ Images</li>
            <li onclick="alert('Opening Library')">📁 Library</li>
            <li onclick="alert('Opening Notebooks')">📓 New notebook</li>
        </ul>
    </div>

    <div class="main-container">
        <div class="logo-icon">✨</div>
        <h2>Your move, Shaik!</h2>
        
        <div class="features-grid">
            <button class="feature-btn">Photos</button>
            <button class="feature-btn">Camera</button>
            <button class="feature-btn">Avatar</button>
        </div>

        <div class="feature-list">
            <div class="list-item">
                <strong>Images</strong>
                <small>Create and edit images</small>
            </div>
            <div class="list-item">
                <strong>Music</strong>
                <small>Make audio tracks</small>
            </div>
            <div class="list-item">
                <strong>Canvas</strong>
                <small>Code, write or make slides</small>
            </div>
        </div>

        <!-- Input Box with Plus and Working Mic -->
        <div class="input-box">
            <button class="plus-btn" onclick="alert('Plus options clicked')">+</button>
            <input type="text" id="userInput" placeholder="Ask Ai Sameer...">
            <div class="action-btns">
                <button class="mic-btn" onclick="startVoiceRecognition()" title="Voice Input">🎤</button>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("మీ బ్రౌజర్ వాయిస్ రికగ్నిషన్‌ని సపోర్ట్ చేయదు.");
                return;
            }
            
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'te-IN'; // తెలుగు వాయిస్ రికగ్నిషన్
                recognition.start();

                recognition.onresult = function(event) {
                    const speechToText = event.results[0][0].transcript;
                    document.getElementById('userInput').value = speechToText;
                };

                recognition.onerror = function(event) {
                    alert("మైక్ పర్మిషన్ లేదా నెట్‌వర్క్ సమస్య ఉంది. దయచేసి క్రోమ్ బ్రౌజర్‌లో మైక్ పర్మిషన్ చెక్ చేయండి.");
                };
            } catch (e) {
                alert("మైక్ రన్ చేయడం కుదరలేదు.");
            }
        }

        function sendMessage() {
            const text = document.getElementById('userInput').value;
            if (text.trim() !== "") {
                alert("సందేశం పంపబడింది: " + text);
                document.getElementById('userInput').value = "";
            }
        }
    </script>

</body>
</html>
